<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis datos · kcarrion</title>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-root="./">

  <div id="site-navbar"></div>

  <main class="auth">
    <div class="auth__card auth__card--wide">
      <span class="eyebrow">Mi cuenta</span>
      <h1>Editar mis datos</h1>
      <p class="lead" style="font-size:1rem">Actualiza tu información personal y profesional.</p>

      <div id="msg" class="form-msg" role="alert"></div>

      <form id="perfil-form" novalidate>
        <div class="field">
          <label for="nombre">Nombre completo</label>
          <input class="input" id="nombre" name="nombre" type="text" autocomplete="name" maxlength="100">
        </div>

        <div class="field">
          <label for="email">Correo electrónico</label>
          <input class="input" id="email" name="email" type="email" readonly aria-describedby="email-ayuda">
          <span class="small" id="email-ayuda">El correo es tu usuario de acceso y no se puede cambiar aquí.</span>
        </div>

        <div class="field">
          <label for="celular">Celular</label>
          <input class="input" id="celular" name="celular" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="14" placeholder="9XX XXX XXX">
        </div>

        <div class="form-row form-row--flex">
          <div class="field">
            <label for="area">Área</label>
            <select class="input" id="area" name="area"></select>
          </div>
          <div class="field" id="field-area-otra" hidden>
            <label for="area-otra">¿Cuál es tu área?</label>
            <input class="input" id="area-otra" type="text" maxlength="60" placeholder="Escribe tu área">
          </div>
        </div>
        <div class="form-row form-row--flex">
          <div class="field" id="field-esp">
            <label for="esp">Especialidad</label>
            <select class="input" id="esp" name="esp"></select>
          </div>
          <div class="field" id="field-esp-otra" hidden>
            <label for="esp-otra">¿Cuál es tu especialidad?</label>
            <input class="input" id="esp-otra" type="text" maxlength="80" placeholder="Escribe tu especialidad">
          </div>
        </div>

        <div class="form-row form-row--3">
          <div class="field"><label for="dep">Departamento</label><select class="input" id="dep"></select></div>
          <div class="field"><label for="prov">Provincia</label><select class="input" id="prov" disabled></select></div>
          <div class="field"><label for="dist">Distrito</label><select class="input" id="dist" disabled></select></div>
        </div>
        <div class="field" id="field-dist-otro" hidden>
          <label for="dist-otro">Escribe tu distrito</label>
          <input class="input" id="dist-otro" type="text" maxlength="80">
        </div>

        <div class="perfil-actions">
          <a class="btn btn--outline" href="panel.html">Cancelar</a>
          <button class="btn btn--primary" type="submit" id="guardar">Guardar cambios</button>
        </div>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/peru.js"></script>
  <script src="assets/js/perfil-data.js"></script>
  <script src="assets/js/perfil.js"></script>
</body>
</html>
