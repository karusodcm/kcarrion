name: Deploy a kcarrion.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-kcarrion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Subir por FTPS a kcarrion.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # La cuenta FTP ya esta limitada a /home/orieruxo/kcarrion.com,
          # asi que "./" es la raiz de kcarrion.com y nunca public_html.
          server-dir: ./
          local-dir: ./
          # Nunca borra archivos remotos que no esten en el repositorio.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            **/node_modules/**
